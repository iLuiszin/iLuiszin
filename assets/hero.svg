<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Luís Felipe, AI-native full-stack engineer">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1c2a33" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="30%" r="70%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="100%" r="55%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="880" height="300" rx="14"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .name{font-weight:800;font-size:52px;fill:#e6f1f2;letter-spacing:-1.5px}
      .role{font-size:15px;fill:#7dd3c8;letter-spacing:3px}
      .dim{fill:#5b7380}
      .ln{font-size:13px;opacity:0;animation:in .4s ease forwards}
      .l1{animation-delay:.4s}.l2{animation-delay:1.1s}.l3{animation-delay:1.8s}.l4{animation-delay:2.5s}.l5{animation-delay:3.2s}
      .ok{fill:#34d399}.run{fill:#fbbf24}.cy{fill:#7dd3c8}.tx{fill:#c3d4d9}
      .dot{animation:pulse 1.6s ease-in-out infinite}
      .d2{animation-delay:.3s}.d3{animation-delay:.6s}.d4{animation-delay:.9s}
      .cursor{animation:blink 1s steps(1) infinite}
      .scan{animation:scan 6s linear infinite}
      @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(320px)}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="880" height="300" fill="#0a1116"/>
    <rect width="880" height="300" fill="url(#grid)"/>
    <rect width="880" height="300" fill="url(#glow)"/>
    <rect width="880" height="300" fill="url(#glow2)"/>
    <rect class="scan" x="0" y="0" width="880" height="40" fill="#7dd3c8" opacity=".035"/>

    <text x="44" y="62" class="mono role">AI-NATIVE · FULL-STACK ENGINEER</text>
    <text x="40" y="124" class="sans name">Luís Felipe</text>
    <text x="44" y="154" class="mono dim" font-size="13">Brasília, BR  ·  TypeScript · Node.js · React · PostgreSQL</text>

    <g transform="translate(44 186)">
      <circle cx="5" cy="5" r="4" class="ok dot"/>
      <circle cx="21" cy="5" r="4" class="ok dot d2"/>
      <circle cx="37" cy="5" r="4" class="run dot d3"/>
      <circle cx="53" cy="5" r="4" class="ok dot d4"/>
      <text x="70" y="10" class="mono dim" font-size="12">4 agents online</text>
    </g>

    <g transform="translate(486 34)">
      <rect width="352" height="232" rx="10" fill="#0d171d" stroke="#1f3340"/>
      <rect width="352" height="30" rx="10" fill="#10202a"/>
      <rect y="20" width="352" height="10" fill="#10202a"/>
      <circle cx="18" cy="15" r="5" fill="#f87171" opacity=".8"/>
      <circle cx="36" cy="15" r="5" fill="#fbbf24" opacity=".8"/>
      <circle cx="54" cy="15" r="5" fill="#34d399" opacity=".8"/>
      <text x="176" y="19" text-anchor="middle" class="mono dim" font-size="11">~/orchestrate · wave 2</text>
      <g class="mono" transform="translate(18 60)">
        <text class="ln l1" y="0"><tspan class="cy">$</tspan><tspan class="tx"> orchestrate-project 3440</tspan></text>
        <text class="ln l2" y="30"><tspan class="ok">✓</tspan><tspan class="tx"> plan reviewed by advisor</tspan></text>
        <text class="ln l3" y="60"><tspan class="run">●</tspan><tspan class="tx"> 3 agents · 3 worktrees · 3 PRs</tspan></text>
        <text class="ln l4" y="90"><tspan class="ok">✓</tspan><tspan class="tx"> review GO · CI green · merged</tspan></text>
        <text class="ln l5" y="120"><tspan class="ok">✓</tspan><tspan class="tx"> QA on staging: pass</tspan></text>
        <rect class="cursor" x="0" y="140" width="9" height="16" fill="#7dd3c8"/>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="299" rx="14" fill="none" stroke="#1f3340"/>
</svg>
